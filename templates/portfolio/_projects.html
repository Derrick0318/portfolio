<section id="projects">
  <div class="wrap">
    <div class="index-label scroll-reveal" data-reveal>INDEX / SELECTED WORK</div>
    <div class="section-head">
      <h2 class="scroll-reveal" data-reveal>Projects I have built.</h2>
      <p class="scroll-reveal" data-reveal>Four academic projects across applied AI, web systems, mobile interfaces, and backend integration.</p>
    </div>
    <div class="proj-list" id="proj-list">
      {% for project in projects %}
      <a class="proj-row" href="{{ project.url }}" data-proj data-title="{{ project.title }}" data-image="{{ url_for('static', filename='images/portfolio/' ~ project.slug ~ '.webp') }}" aria-label="Open {{ project.title }} project">
        <span class="proj-num">{{ project.number }}</span>
        <span>
          <span class="proj-title-big">{{ project.title }}</span>
          <span class="proj-sub">{{ project.summary }} · {{ project.preview_stack | join(', ') }}</span>
        </span>
        <span class="proj-row-arrow" aria-hidden="true">↗</span>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
