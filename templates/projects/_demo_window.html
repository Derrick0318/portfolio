<section class="project-hero">
  <div class="project-title-block">
    <p>{{ project.category }} / {{ project.year }}</p>
    <h1>{{ project.title }}</h1>
    <span>{{ project.summary }}</span>
    <div class="project-hero-facts">
      <span><strong>Role</strong>{{ project.role }}</span>
      <span><strong>Stack</strong>{{ project.preview_stack | join(', ') }}</span>
    </div>
  </div>

  <div class="demo-window">
    <div class="window-topbar">
      <strong>Working demo</strong>
      <a href="{{ project.demo_url }}" target="_blank" rel="noopener noreferrer">Open full demo</a>
    </div>
    <iframe src="{{ project.demo_url }}" title="{{ project.title }} demo" loading="eager"></iframe>
  </div>
</section>
